[project]
name = "dydx-agent-gateway"
version = "0.2.5"
description = "MCP gateway for AI agents to dYdX v4: market data, funding heatmap, TA, verified trader analytics (deposit-adjusted PnL), leaderboards, anomaly & liquidation-cascade detectors. Analytics-only: no trading tools, no keys."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["dydx", "mcp", "ai-agents", "perpetuals", "analytics", "trading", "defi"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Intended Audience :: Developers",
]
dependencies = [
    "fastmcp>=3.0",
    "pycryptodome>=3.20",
    "ecdsa>=0.18",
]

[project.urls]
Homepage = "https://github.com/alekskram/dydx-agent-gateway"
Repository = "https://github.com/alekskram/dydx-agent-gateway"
Issues = "https://github.com/alekskram/dydx-agent-gateway/issues"
Changelog = "https://github.com/alekskram/dydx-agent-gateway/blob/master/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "pip-audit"]

[project.scripts]
dydx-agent-gateway = "dydx_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dydx_mcp"]

[tool.pytest.ini_options]
markers = ["online: live API integration (run with -m online)"]
addopts = "-m 'not online'"
